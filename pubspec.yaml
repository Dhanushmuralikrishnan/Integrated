name: energy_management_app
description: Energy Management System Project
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Utilities
  cupertino_icons: ^1.0.8
  fl_chart: ^0.68.0
  pdf: ^3.10.7
  printing: ^5.12.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.0
  share_plus: ^10.1.0
  cross_file: ^0.3.4+1  # Added for XFile

  # Firebase
  firebase_core: ^3.8.0
  cloud_firestore: ^5.5.0
  firebase_auth: ^5.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # No fonts section needed – default system font is used